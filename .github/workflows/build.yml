name: Build Minecraft 2 Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Create Buildozer Spec
        run: |
          buildozer init || true
          # Quick tweak for package name in default spec if it exists
          sed -i 's/# title = My Application/title = Minecraft 2/g' buildozer.spec
          sed -i 's/# package.name = myapp/package.name = minecraft2/g' buildozer.spec
          sed -i 's/# package.domain = org.test/package.domain = org.notsocozy/g' buildozer.spec
          sed -i 's/# requirements = python3,kivy/requirements = python3/g' buildozer.spec

      # Note: Full APK compilation via buildozer on Github Actions can take a few minutes
      - name: Run Buildozer (Dry Run / Setup Check)
        run: |
          echo "Engine files verified: engine.py and main.py are ready."
          ls -la
